# Série: the app's tests and checks on every push and pull request.
name: test
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node scripts/check-locales.mjs
      - run: node scripts/check-source-strings.mjs --strict
      - run: npx vitest run
      - run: npm run build

  api:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: api } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: api/package-lock.json }
      - run: npm ci --omit=optional --no-audit --no-fund
      - run: node --test
