# fly.toml app configuration file generated for serie-api on 2026-11-04T00:41:43Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'serie-api'
primary_region = 'cdg'

[build]
  dockerfile = 'Dockerfile'

[env]
  AUDIT_LOG = '1'
  DATA_DIR = '/data'
  FIRST_USER_ADMIN = '1'
  NODE_ENV = 'production'
  ORIGIN = 'https://serie-treino.netlify.app'
  PASSWORD_LOGIN = '1'
  PORT = '3000'
  RP_ID = 'serie-treino.netlify.app'

[[mounts]]
  source = 'serie_data'
  destination = '/data'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '20s'
    method = 'GET'
    path = '/api/health'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
