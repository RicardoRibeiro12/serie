# The API on Fly.io. Only Netlify reaches it: every request must carry Netlify's signature
# (EDGE_PROXY_SECRET, set with `fly secrets set`, never written here). Data lives on the volume.
# Deploy from this folder: `cd api && fly deploy`. First deploy: see DEPLOY.md (the order matters for the first admin and invite-only signup).
app = "serie-api"
primary_region = "mad"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  DATA_DIR = "/data"
  PASSWORD_LOGIN = "1"
  FIRST_USER_ADMIN = "1"
  AUDIT_LOG = "1"
  # The site the app is served from. Passkeys are bound to this host.
  ORIGIN = "https://SITE.netlify.app"
  RP_ID = "SITE.netlify.app"

[[mounts]]
  source = "serie_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/api/health"
    timeout = "5s"
