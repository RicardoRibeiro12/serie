# The public site and the app, built by scripts/build-site.mjs into ./site.
# The app's backend is Supabase (frontend/src/lib/supa-api.js, supabase/*.sql).
#
# Netlify environment variables (Project configuration > Environment variables):
#   VITE_SUPABASE_URL        https://<project ref>.supabase.co
#   VITE_SUPABASE_ANON_KEY   the project's publishable key (never the secret / service_role key)
# Netlify sets URL itself; the build uses it as the canonical origin.

[build]
  command = "npm ci --prefix frontend && node scripts/build-site.mjs"
  publish = "site"

[build.environment]
  NODE_VERSION = "22"
